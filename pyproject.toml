[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horys-pixel"
version = "0.2.0"
description = "Pixel art 2D top-down constante: arte parada aprovada como gabarito + Blender para animar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
horys = "horys_pixel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
horys_pixel = ["**/*.html", "**/*.lua", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
