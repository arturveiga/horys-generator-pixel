# SpriteKiln project settings (https://github.com/LucasJRamos/spritekiln).
# Commands run anywhere inside this folder find this file.

[project]
specs = "art/specs"        # where `spritekiln new` creates specs
engine = "godot"       # godot | unity | monogame | generic
ai = ["claude"]       # assistants whose files `spritekiln update` refreshes

[export]
# `spritekiln export <spec>` (or `render --export`) copies the atlas, JSON and maps here;
# for Godot it also writes SpriteFrames, a CanvasTexture and a ready scene.
dir = "assets/spritekiln"
godot_project = "."   # folder with project.godot

[defaults]                # given to specs created by `spritekiln new`
view = "topdown"
size = 32
palette = "cozy"
camera = { pitch = 38, scale = 0.07333 }
directions = 4
mirror = true

[style]                   # the art style every asset follows (`spritekiln style`); change it only when asked
recorded = 2026-11-11
view = "topdown"
height = 24               # px on screen of a human-sized character
scale = 0.07333           # camera.scale of every asset (from height)
size = 32                 # frame px for that character
directions = 4
mirror = true
palette = "cozy"
colors = "saturated, warm, cozy; cool hue-shifted shadows"
outline = "dark"
outline_color = "#2a1f2d" # with outline "dark"; empty: the darkest tone of the ramps
shading = "toon"
lines = "depth"
highlights = false
dither = "none"
light = "classic"
proportions = "chibi"
face = "minimal"          # minimal: eyes only, no nose; simple: + a hint of brow or nose on big heads; detailed
animation = "snappy"
snap = true               # root and torso move in whole pixels
references = ["Stardew Valley", "Sprout Lands"]
notes = "estilo horys-cozy: 2-3 tons chapados por material, sem dithering, VFX como sprites em loop curto; bosses maiores com a mesma densidade"
