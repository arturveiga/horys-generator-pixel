<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horys Estúdio</title>
<link rel="stylesheet" href="/static/app.css">
<script>window.HORYS_TOKEN = "__TOKEN__";</script>
</head>
<body>
<div id="app">
  <header class="topo">
    <div class="marca"><span class="logo">H</span><span class="nome">Horys Estúdio</span></div>
    <input id="busca" type="search" placeholder="Buscar por nome ou pasta…">
    <div class="topo-acoes">
      <button id="bt-aprovados" class="chip">Aprovados</button>
      <button id="bt-pedidos" class="chip">Pedidos <span id="n-pedidos" class="badge">0</span></button>
      <button id="bt-jobs" class="chip">Tarefas <span id="n-jobs" class="badge">0</span></button>
      <span id="status" class="status">conectando…</span>
    </div>
  </header>
  <div class="corpo">
    <aside class="lateral">
      <div class="lateral-topo"><span>Pastas</span><button id="bt-atualizar" class="icone" title="Atualizar">⟳</button></div>
      <div id="arvore" class="arvore"></div>
    </aside>
    <main id="principal" class="principal">
      <div class="vazio">Escolha uma pasta à esquerda.</div>
    </main>
    <aside id="painel" class="painel escondido"></aside>
  </div>
</div>
<template id="tpl-inspetor">
  <div class="inspetor">
    <div class="barra">
      <button class="icone" data-acao="voltar" title="Voltar à grade (Esc)">←</button>
      <span class="titulo"></span>
      <span class="sep"></span>
      <label>Zoom <select data-ctl="zoom"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>6</option><option>8</option><option>12</option><option>16</option></select></label>
      <label>Fundo <select data-ctl="fundo"><option value="xadrez">xadrez</option><option value="verde">grama</option><option value="escuro">escuro</option><option value="claro">claro</option></select></label>
      <label><input type="checkbox" data-ctl="grade"> grade</label>
      <label class="so-folha"><input type="checkbox" data-ctl="onion"> onion</label>
      <span class="so-folha player">
        <button class="icone" data-acao="ant" title="Quadro anterior (←)">⏮</button>
        <button class="icone" data-acao="play" title="Tocar (espaço)">▶</button>
        <button class="icone" data-acao="prox" title="Próximo quadro (→)">⏭</button>
        <span class="quadro-n"></span>
      </span>
    </div>
    <div class="palco"><div class="tela"><canvas class="c-img"></canvas><canvas class="c-risco"></canvas></div></div>
    <div class="tira so-folha"></div>
  </div>
</template>
<script src="/static/app.js"></script>
</body>
</html>
